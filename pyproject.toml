[project]
name = "annie"
version = "0.1.0"
description = "Learning neural networks from first principles, as a first step toward physical AI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "graphviz>=0.21",
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.5",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pydot>=4.0.1",
    "scikit-learn",
    "scipy",
    "torch>=2.14.1",
]

[project.scripts]
iris = "mlp.experiments.iris:test_iris"
toy-regression = "mlp.experiments.toy_regression:test_regression"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mlp"]
